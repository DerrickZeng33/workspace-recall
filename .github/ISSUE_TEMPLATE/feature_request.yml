name: Feature request
description: Propose a scoped improvement to capture, review, or restore behavior.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem rather than a private real-world workspace. Do not include personal information, real paths, or confidential screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Space Recorder solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: What should the user see or be able to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and safety impact
      description: Could this collect, store, launch, transmit, or expose additional data?
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I removed personal information, private paths, and confidential content.
          required: true
