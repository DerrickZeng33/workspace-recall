name: Bug report
description: Report a reproducible Workspace Recall problem using sanitized data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload real layout files, previews, private paths, window titles, documents, or full-desktop screenshots. Use fictional test data. Report security problems privately through the Security tab instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or commit SHA you tested.
      placeholder: e.g. commit 0123abc
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Application and file format
      description: Use a product name and extension only. Do not include a real path or document title.
      placeholder: e.g. Microsoft Excel and .xlsx
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Capture status shown
      options:
        - File identified
        - Program only
        - Needs review
        - Excluded
        - Window did not appear
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Safe reproduction steps
      description: Reproduce with fictional files and describe each step.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal information, real paths, private document names, and sensitive screenshots.
          required: true
        - label: This is not a security vulnerability.
          required: true
